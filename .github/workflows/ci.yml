name: Backend CI

on:
    push:
        branches:
            - develop
            - main

    pull_request:
        branches:
            - develop
            - main

jobs:
    build-and-test:
        name: Build and Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma Client
              run: npm run generate

            - name: Run lint
              run: npm run lint

            - name: Run tests
              run: npm test -- --passWithNoTests

            - name: Build application
              run: npm run build
